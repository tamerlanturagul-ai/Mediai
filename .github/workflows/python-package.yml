# TASK-010: all quality gates are blocking (no --exit-zero / non-blocking steps).
# - ruff check: default ruleset, zero warnings tolerated
#   (2 explicit `noqa` with reason: B008 FastAPI File(...) idiom,
#   BLE001 Pillow-decode guard degrading to quality="unknown").
# - mypy: strict on the clinical core (app/domain, app/services).
# - pytest: full suite + coverage floor 85%.

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install ruff mypy pytest pytest-cov
        python -m pip install -r medi-ai/requirements.txt
    - name: Lint with ruff
      run: |
        python -m ruff check medi-ai
    - name: Type-check domain/services with mypy (strict)
      run: |
        python -m mypy medi-ai/app/domain medi-ai/app/services
    - name: Test with pytest
      run: |
        python -m pytest --cov=medi-ai/app --cov-report=term-missing --cov-fail-under=85
